name: OpenWebull
options:
  bundleIdPrefix: com.openwebull
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  OpenWebull:
    type: application
    platform: macOS
    sources:
      - path: OpenWebull
    info:
      path: OpenWebull/Info.plist
      properties:
        CFBundleDisplayName: OpenWebull
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "MIT License"
        LSApplicationCategoryType: public.app-category.finance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openwebull.desktop
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  OpenWebullTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenWebullTests
    dependencies:
      - target: OpenWebull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openwebull.desktop.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenWebull.app/Contents/MacOS/OpenWebull"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  OpenWebull:
    build:
      targets:
        OpenWebull: all
        OpenWebullTests: [test]
    test:
      targets:
        - OpenWebullTests
